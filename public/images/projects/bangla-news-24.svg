<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="newsCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142136"/>
      <stop offset="100%" stop-color="#0c1626"/>
    </linearGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="newsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#newsBg)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.06" fill="#38BDF8">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="200" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="400" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/><circle cx="500" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/>
    <circle cx="50" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="250" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="350" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="450" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="550" cy="100" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="200" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="300" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="400" cy="150" r="1.5"/><circle cx="450" cy="150" r="1.5"/><circle cx="500" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/>
    <circle cx="50" cy="200" r="1.5"/><circle cx="100" cy="200" r="1.5"/><circle cx="150" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="250" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="350" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="450" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="550" cy="200" r="1.5"/>
    <circle cx="50" cy="250" r="1.5"/><circle cx="100" cy="250" r="1.5"/><circle cx="150" cy="250" r="1.5"/><circle cx="200" cy="250" r="1.5"/><circle cx="250" cy="250" r="1.5"/><circle cx="300" cy="250" r="1.5"/><circle cx="350" cy="250" r="1.5"/><circle cx="400" cy="250" r="1.5"/><circle cx="450" cy="250" r="1.5"/><circle cx="500" cy="250" r="1.5"/><circle cx="550" cy="250" r="1.5"/>
  </g>

  <!-- News Header Mockup -->
  <rect x="35" y="25" width="530" height="42" rx="8" fill="url(#newsCardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#newsShadow)"/>
  <rect x="48" y="32" width="95" height="28" rx="5" fill="url(#redBadge)"/>
  <text x="56" y="51" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="1">NEWS 24</text>
  
  <text x="160" y="50" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">জাতীয়</text>
  <text x="210" y="50" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">রাজনীতি</text>
  <text x="270" y="50" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">অর্থনীতি</text>
  <text x="330" y="50" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">আন্তর্জাতিক</text>
  <text x="410" y="50" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">বিজ্ঞান ও প্রযুক্তি</text>

  <circle cx="535" cy="46" r="12" fill="#20334F"/>
  <text x="531" y="50" fill="#60A5FA" font-size="12">👤</text>

  <!-- Breaking News Marquee -->
  <rect x="35" y="77" width="530" height="26" rx="4" fill="#0B1220" stroke="#20334F" stroke-width="1"/>
  <rect x="35" y="77" width="80" height="26" rx="4" fill="#dc2626"/>
  <text x="42" y="94" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">ব্রেকিং নিউজ</text>
  <text x="125" y="94" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="10">দেশের তথ্যপ্রযুক্তি খাতে রেকর্ড প্রবৃদ্ধি • নতুন এআই হাবের উদ্বোধন অনুষ্ঠানে বিশেষজ্ঞরা...</text>

  <!-- Main News Layout -->
  <!-- Lead Story (Left) -->
  <rect x="35" y="113" width="340" height="202" rx="8" fill="url(#newsCardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#newsShadow)"/>
  <rect x="47" y="125" width="316" height="110" rx="6" fill="#1b2a44"/>
  <!-- Image placeholder art -->
  <path d="M 60 215 L 140 160 L 210 200 L 280 145 L 350 215 Z" fill="#223759" opacity="0.6"/>
  <circle cx="100" cy="155" r="15" fill="#f59e0b" opacity="0.3"/>
  <rect x="58" y="135" width="60" height="18" rx="4" fill="#dc2626"/>
  <text x="64" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">শীর্ষ সংবাদ</text>

  <text x="47" y="255" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ডিজিটাল রূপান্তরে এগিয়ে যাচ্ছে বাংলাদেশ</text>
  <text x="47" y="275" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="10">কৃত্রিম বুদ্ধিমত্তা ও ডেটা সায়েন্স ভিত্তিক নতুন উদ্যোগ দেশের অর্থনীতিতে আনছে গতিশীলতা...</text>
  <text x="47" y="298" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">🕒 ৫ মিনিট আগে • বিশেষ প্রতিবেদন</text>

  <!-- Sidebar "Most Read" (Right) -->
  <rect x="390" y="113" width="175" height="202" rx="8" fill="url(#newsCardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#newsShadow)"/>
  <rect x="400" y="123" width="155" height="24" rx="4" fill="#0B1220"/>
  <text x="410" y="139" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔥 সর্বাধিক পঠিত</text>

  <text x="404" y="165" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="900">১</text>
  <text x="420" y="164" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">আইটি খাতে বিশাল কর্মসংস্থান</text>
  <text x="420" y="176" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">প্রযুক্তি ডেস্ক</text>
  <line x1="400" y1="184" x2="555" y2="184" stroke="#20334F" stroke-width="0.8"/>

  <text x="404" y="205" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="900">২</text>
  <text x="420" y="204" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">নতুন শিক্ষানীতির রূপরেখা চূড়ান্ত</text>
  <text x="420" y="216" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">জাতীয় সংবাদ</text>
  <line x1="400" y1="224" x2="555" y2="224" stroke="#20334F" stroke-width="0.8"/>

  <text x="404" y="245" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="900">৩</text>
  <text x="420" y="244" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">বৈদেশিক বাণিজ্যে ইতিবাচক ধারা</text>
  <text x="420" y="256" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">অর্থনীতি ডেস্ক</text>
  <line x1="400" y1="264" x2="555" y2="264" stroke="#20334F" stroke-width="0.8"/>

  <text x="404" y="285" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="900">৪</text>
  <text x="420" y="284" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">বিশ্ববাজারে জ্বালানি মূল্যের ওঠানামা</text>
  <text x="420" y="296" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">আন্তর্জাতিক</text>
</svg>
