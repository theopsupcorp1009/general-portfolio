<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#080e1b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162947"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#7867FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#3478F6" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="420" y1="0" x2="420" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="540" y1="0" x2="540" y2="340"/>
  </g>

  <!-- App Header Bar Mockup -->
  <rect x="40" y="25" width="520" height="42" rx="8" fill="url(#cardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="65" cy="46" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="85" cy="46" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="105" cy="46" r="6" fill="#10b981" opacity="0.8"/>
  <text x="135" y="51" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">🛒 বাজার দর</text>
  <rect x="235" y="34" width="170" height="24" rx="12" fill="#0B1220" stroke="#20334F" stroke-width="1"/>
  <text x="250" y="50" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">🔍 পণ্যের নাম খুঁজুন...</text>
  <rect x="470" y="34" width="75" height="24" rx="6" fill="url(#accent)"/>
  <text x="487" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">লগইন</text>

  <!-- Hero Banner Mockup inside card -->
  <rect x="40" y="80" width="520" height="75" rx="8" fill="#13233a" stroke="#20334F" stroke-width="1"/>
  <text x="65" y="112" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="13" font-weight="600">আজকের নিত্যপ্রয়োজনীয় পণ্যের বাজারদর</text>
  <text x="65" y="134" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="11">প্রতিদিনের চাল, ডাল, তেল, সবজি, মাছ ও মাংসের দরদাম যাচাই করুন</text>
  
  <!-- Today Price Ticker -->
  <rect x="40" y="165" width="520" height="30" rx="6" fill="#0B1220" stroke="#20334F" stroke-width="1"/>
  <text x="55" y="184" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🟢 মিনিকেট চাল: ৳৭২ (-২%)</text>
  <text x="210" y="184" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🔴 সয়াবিন তেল: ৳১৮৫ (+৩%)</text>
  <text x="385" y="184" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🟢 আলু: ৳৩৫ (-৫%)</text>

  <!-- 3 Product Cards Mockup -->
  <!-- Card 1 -->
  <rect x="40" y="205" width="160" height="110" rx="8" fill="url(#cardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="52" y="215" width="40" height="40" rx="6" fill="#1e3a5f"/>
  <text x="62" y="240" font-size="20">🌾</text>
  <text x="100" y="230" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">নাজিরশাইল</text>
  <text x="100" y="246" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="10">চাল (১ কেজি)</text>
  <text x="52" y="280" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ ৭৫</text>
  <rect x="125" y="267" width="60" height="18" rx="9" fill="url(#greenGlow)"/>
  <text x="135" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">▼ ৩.২%</text>
  <rect x="52" y="293" width="136" height="12" rx="3" fill="#0B1220"/>
  <text x="56" y="302" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">কাওরান বাজার: ৳৭২ - ৳৭৮</text>

  <!-- Card 2 -->
  <rect x="220" y="205" width="160" height="110" rx="8" fill="url(#cardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="232" y="215" width="40" height="40" rx="6" fill="#3b2b1e"/>
  <text x="242" y="240" font-size="20">🧅</text>
  <text x="280" y="230" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">দেশি পেঁয়াজ</text>
  <text x="280" y="246" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="10">মসলা (১ কেজি)</text>
  <text x="232" y="280" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ ১১০</text>
  <rect x="305" y="267" width="60" height="18" rx="9" fill="url(#redGlow)"/>
  <text x="315" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">▲ ৪.৫%</text>
  <rect x="232" y="293" width="136" height="12" rx="3" fill="#0B1220"/>
  <text x="236" y="302" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">মিরপুর ১ বাজার: ৳১০৫ - ৳১১৫</text>

  <!-- Card 3 -->
  <rect x="400" y="205" width="160" height="110" rx="8" fill="url(#cardBg)" stroke="#20334F" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="412" y="215" width="40" height="40" rx="6" fill="#1e3a47"/>
  <text x="422" y="240" font-size="20">🐟</text>
  <text x="460" y="230" fill="#E8EEFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">রুই মাছ</text>
  <text x="460" y="246" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="10">মাছ (১ কেজি)</text>
  <text x="412" y="280" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="15" font-weight="800">৳ ৩৫০</text>
  <rect x="485" y="267" width="60" height="18" rx="9" fill="url(#greenGlow)"/>
  <text x="495" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">▼ ১.৮%</text>
  <rect x="412" y="293" width="136" height="12" rx="3" fill="#0B1220"/>
  <text x="416" y="302" fill="#8EA2C3" font-family="system-ui, sans-serif" font-size="8">কারওয়ান বাজার: ৳৩৪০ - ৳৩৬০</text>
</svg>
